<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Upload Complete</title><style>body{margin:0;background:#101c31;color:#fff;font-family:Arial,sans-serif;padding:28px}p{color:#b9c8de}</style></head><body><h2 id="title">Finishing image upload…</h2><p id="message">This window will close automatically.</p><script>(function(){var q=new URLSearchParams(location.search),message={type:'iwpOrganizerImageUploadComplete',callbackId:q.get('callbackId')||'',payload:{success:q.get('success')==='1',imageUrl:q.get('imageUrl')||'',error:q.get('error')||''}};try{var channel=new BroadcastChannel('iwpOrganizerImageUpload');channel.postMessage(message);setTimeout(function(){channel.postMessage(message);channel.close()},250)}catch(e){}try{if(window.opener&&!window.opener.closed)window.opener.postMessage(message,location.origin)}catch(e){}document.getElementById('title').textContent=message.payload.success?'Image uploaded':'Image upload failed';document.getElementById('message').textContent=message.payload.success?'The adventure will now finish saving. This window will close automatically.':(message.payload.error||'Unable to upload the image.');setTimeout(function(){window.close()},700)})();</script></body></html>
