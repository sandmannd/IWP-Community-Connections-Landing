name: Community Connections Email Automation
on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:
jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Run Community Connections email automation
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${AUTOMATION_SECRET}" \
            -H "Accept: application/json" \
            https://connections.redlinecreates.com/api/automation-run)
          echo "$response"
